# Throwaway Neo4j for the eval harness, on different ports from the real graph.
# No volume: the harness wipes it on every run anyway.
#   docker compose -f eval/docker-compose.yml up -d
services:
  neo4j-eval:
    image: neo4j:2026.01.4
    container_name: dual-memory-neo4j-eval
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/dualmemory-eval
      - NEO4J_server_memory_heap_max__size=1g
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
